<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>uniflow.cpp — WebGPU demo (Small Q4)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>uniflow.cpp <span>WebGPU</span></h1>
    <p class="lede">
      Experimental in-browser T2A — Small DiT <strong>Q4_0</strong> + T5 Q4_0 via ggml WebGPU
      (lo-fi / faster download). Weights stream from Hugging Face.
    </p>

    <label>Caption
      <input id="caption" type="text" value="a man is speaking while a dog barks" />
    </label>

    <div class="row">
      <label>Duration (s)
        <input id="duration" type="number" min="1" max="10" step="1" value="5" />
      </label>
      <label>Steps
        <input id="steps" type="number" min="4" max="50" step="1" value="25" />
      </label>
      <label>Seed
        <input id="seed" type="number" min="1" step="1" value="42" />
      </label>
    </div>

    <div class="actions">
      <button id="btn-load" type="button">Load models</button>
      <button id="btn-gen" type="button" disabled>Generate</button>
    </div>

    <div id="progress-wrap" class="progress-wrap" hidden>
      <div class="progress-track" aria-hidden="true">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div id="progress-label" class="progress-label"></div>
    </div>

    <pre id="log" aria-live="polite"></pre>
    <audio id="player" controls></audio>
  </main>

  <script>
    var Module = Module || {};
  </script>
  <script async src="uniflow-web.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
