name: Deploy WebGPU demo to GitHub Pages

# Two-stage Pages deploy:
#   1) build  — checkout + Emscripten compile → upload-pages-artifact
#   2) deploy — deploy-pages only (requires github-pages environment)
#
# Repo Settings → Pages → Source = GitHub Actions (required once).

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "CMakeLists.txt"
      - "Makefile"
      - "third_party/ggml/**"
      - ".github/workflows/pages-webgpu.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-webgpu
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ≥4.0.13 ships a Dawn pin with InstanceFeatureName; we still fetch an
      # explicit emdawnwebgpu_pkg so ggml-webgpu does not depend on the
      # toolchain's built-in (too-old) port alone.
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.23

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip

      - name: Fetch emdawnwebgpu (Dawn headers matching ggml-webgpu)
        run: ./scripts/fetch_emdawnwebgpu.sh

      - name: Configure (Emscripten + WebGPU)
        run: |
          emcmake cmake -B build-web -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUNIFLOW_METAL=OFF \
            -DUNIFLOW_CUDA=OFF \
            -DUNIFLOW_BUILD_TESTS=OFF \
            -DGGML_WEBGPU=ON \
            -DGGML_WEBGPU_JSPI=ON \
            -DGGML_OPENMP=OFF \
            -DEMDAWNWEBGPU_DIR="${{ github.workspace }}/third_party/emdawnwebgpu_pkg"

      - name: Build uniflow-web
        run: cmake --build build-web --target uniflow-web --parallel

      - name: Verify site artifacts
        run: |
          test -f web/index.html
          test -f web/app.js
          test -f web/uniflow-web.js
          test -f web/uniflow-web.wasm
          ls -lh web/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
